<!doctype html>
<html><head><meta charset="utf-8"><title>marblehead-lighthouse zoom</title>
<style>html,body{margin:0;padding:0;background:#000;overflow:hidden}#s{width:2560px;height:720px;transform-origin:0 0}</style>
<script src="../reference/scene-helpers.js"></script>
<script src="marblehead-lighthouse.js"></script>
</head><body><div id="s"></div>
<script>
  // ?x=900&y=250&k=2&time=night  -> the region from (x,y) magnified k times
  const q = new URLSearchParams(location.search);
  const x = +q.get("x") || 0, y = +q.get("y") || 0, k = +q.get("k") || 2;
  const el = document.getElementById("s");
  el.innerHTML = marbleheadLighthouseArt({ time: q.get("time") || undefined });
  el.style.transform = `scale(${k}) translate(${-x}px,${-y}px)`;
</script>
</body></html>
